:root{--bg:#fff;--ink:#111;--or:#ff3a14;--soft:#111;--line:#111;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Inter Tight',Helvetica,Arial,sans-serif}
a{color:inherit}
.big{font-weight:800;letter-spacing:-.05em;line-height:.88;text-transform:uppercase}
.small{font-size:11px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;line-height:1.25}
.wrap{padding:0 4vw}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 4vw;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
header nav{display:flex;gap:18px}
header a{text-decoration:none}header a:hover{color:var(--or)}

.hero{background:var(--or);padding:5vh 4vw 3vh;min-height:80vh;display:flex;flex-direction:column;justify-content:space-between}
.hero h1{font-size:clamp(5rem,29vw,25rem);margin:0;color:var(--ink);letter-spacing:-.06em}
.hero .row{order:-1;display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:0 0 6vh;border-top:1px solid var(--line);padding-top:14px}

.sec{border-top:1px solid var(--line);padding:30px 4vw 56px}
.sechead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:26px}
.sechead h2{font-size:clamp(2.4rem,8vw,6.5rem);margin:0;color:var(--ink)}
.sechead h2 i{font-style:normal}
.sechead .small{max-width:200px;text-align:right}
.list{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:end;padding:10px 0 8px;border-bottom:1px solid var(--line);color:var(--ink)}
.item b{font-size:clamp(1.5rem,5vw,3.4rem)}

.ctrl{display:flex;gap:8px;margin-bottom:12px;justify-content:flex-end}

.ctrl button:hover{background:var(--ink);color:#fff}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}

(async function(){
 try{

 }

  var s=sec(t),box=el("div");s.appendChild(box);
  function draw(){box.innerHTML="";arr.forEach(function(c,i){
   c.links=c.links||[];

  draw();var a=el("button","+ Tambah kategori / platform");a.onclick=function(){arr.push({platform:"",count:"",note:"",links:[{label:"",url:"https://"}]});draw()};s.appendChild(a)
 }

 }catch(e){}
